<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinAL Dummy Bank</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header>
        <h1>SentinAL Dummy Bank</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#pay-bills">Pay Bills</a></li>
            <li><a href="#invest">Invest</a></li>
        </ul>
    </nav>

    <main>
        <section id="pay-bills">
            <h2>Pay Electricity Bill</h2>
            
            <div class="form-group">
                <label for="biller-input">Biller Name:</label>
                <input type="text" id="biller-input" placeholder="Enter biller name">
            </div>

            <div class="form-group">
                <label for="amount-input">Amount:</label>
                <input type="number" id="amount-input" placeholder="Enter amount" min="0" step="0.01">
            </div>

            <button id="pay-now-btn">Pay Now</button>

            <div id="error-msg" class="message error-msg" style="display: none;"></div>
            <div id="success-msg" class="message success-msg" style="display: none;"></div>
        </section>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
